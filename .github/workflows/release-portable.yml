name: Build portable release binary

# Triggers:
#   - Tag push matching v*: builds and attaches the binary to that release.
#   - Manual run from the Actions tab: builds and uploads as a workflow
#     artifact (handy for testing without cutting a real release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail the release BEFORE building if any on-disk integer is read in host
      # order.  Cheap, and it is the one defect class that cannot be caught by
      # testing here: every machine this project runs on is little-endian, so a
      # host-order read behaves perfectly until it does not.  Two separate
      # hand-run audits missed a site; this does not.
      - name: Check for host-order on-disk reads
        run: ./scripts/check-endian-reads.sh

      # Cache the nvCOMP tarball (~45 MB) across runs so we don't re-download
      # from NVIDIA's CDN every time.  Key includes the version so a bump
      # invalidates the cache automatically.
      - name: Cache nvCOMP tarball
        uses: actions/cache@v4
        with:
          path: ~/.cache/gzstd-build
          key: nvcomp-5.2.0.10-cuda12-${{ runner.os }}

      # The zstd release the binary is built against is pinned in the build
      # script (ZSTD_VERSION, with its ZSTD_SHA256); read it from there so the
      # cache key and the smoke test cannot drift from it.
      - name: zstd version
        id: zstd
        run: |
          v=$(grep -oP 'ZSTD_VERSION="\$\{ZSTD_VERSION:-\K[0-9.]+' scripts/build-portable.sh)
          s=$(grep -oP 'ZSTD_SHA256="\$\{ZSTD_SHA256:-\K[0-9a-f]+' scripts/build-portable.sh)
          [ -n "$v" ] && [ -n "$s" ] || { echo "ERROR: cannot read ZSTD_VERSION/ZSTD_SHA256 from the build script"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$s" >> "$GITHUB_OUTPUT"

      # Cache the zstd source tarball like nvCOMP.  Its own directory and key,
      # so a zstd bump never invalidates the nvCOMP cache or the other way round.
      # The build script verifies the checksum whether or not this hits.
      - name: Cache zstd source
        uses: actions/cache@v4
        with:
          path: ~/.cache/gzstd-zstd
          key: zstd-${{ steps.zstd.outputs.version }}-${{ steps.zstd.outputs.sha }}-${{ runner.os }}

      - name: Build portable binary
        run: |
          scripts/build-portable.sh
          # Files inside the bind-mounted build dir end up root-owned because
          # the docker container runs as root.  Reset ownership so subsequent
          # steps can read/move them.
          sudo chown -R "$(id -u):$(id -g)" build-portable/

      - name: Smoke test (CPU path only — no GPU, no driver on hosted runners)
        run: |
          # Fail when a producer in a round-trip pipeline exits nonzero, even
          # if cmp has already received the expected bytes.  grep must consume
          # full producer output under pipefail, so the checks below omit -q.
          set -euo pipefail
          # Hosted runners have NO NVIDIA driver — exactly the environment a
          # portable binary must support.  Since v0.13.55 NVML is dlopen'd at
          # runtime, so the binary must carry no DT_NEEDED on libnvidia-ml;
          # assert that here so a stub-linking regression fails the release.
          if ldd build-portable/gzstd | grep "libnvidia-ml" >/dev/null; then
            echo "ERROR: binary has a hard NVML dependency (DT_NEEDED" \
                 "libnvidia-ml) — it will not start on driver-less machines"
            ldd build-portable/gzstd
            exit 1
          fi

          # Runs directly, no LD_LIBRARY_PATH tricks: this is the real
          # driver-less user experience.
          ./build-portable/gzstd --version

          # The zstd inside must be the pinned release WITH its worker threads.
          # Every release before v0.17.93 linked Ubuntu 20.04's libzstd.a (zstd
          # 1.4.4, single-threaded) and --sliding-window died at once:
          # "ZSTD_CCtx_setParameter(nbWorkers): Unsupported parameter".
          ./build-portable/gzstd --version \
            | grep -F "[zstd ${{ steps.zstd.outputs.version }}, multithreaded]" \
            || { echo "ERROR: binary does not report zstd ${{ steps.zstd.outputs.version }}, multithreaded"; exit 1; }
          head -c 20000000 /dev/urandom | base64 > sw.txt
          ./build-portable/gzstd --sliding-window -q -f sw.txt -o sw.txt.zst
          ./build-portable/gzstd -d -q -c sw.txt.zst | cmp - sw.txt
          if command -v zstd >/dev/null 2>&1; then
            zstd -q -dc sw.txt.zst | cmp - sw.txt
            zstd -q -T0 -f sw.txt -o sw.ref.zst
            cmp sw.txt.zst sw.ref.zst || echo "note: --sliding-window output differs from this runner's zstd ($(zstd -V))"
          fi
          echo "--sliding-window round-trip OK"
          rm -f sw.txt sw.txt.zst sw.ref.zst

          # CPU round-trip — exercises the dispatch and proves the binary
          # actually loads on a fresh Ubuntu 22.04 host (different glibc
          # than the build container's 20.04).
          echo "gzstd portable smoke test $(date)" > test.txt
          ./build-portable/gzstd --cpu-only -k -f test.txt
          ./build-portable/gzstd --cpu-only -d -k -f test.txt.zst -o test.recovered
          diff test.txt test.recovered
          rm -rf test.txt test.txt.zst test.recovered

          # --tar --acls --xattrs round-trip: proves the shipped binary actually
          # restores POSIX ACLs and xattrs (not just that the flags parse).  The
          # runner's ext4 workspace supports both; acl/attr CLIs may not be
          # preinstalled.
          sudo apt-get update -qq && sudo apt-get install -y -qq acl attr
          mkdir -p acltest/src acltest/out
          echo data > acltest/src/f
          setfacl -m "u:$(id -u):rwx" acltest/src/f
          setfattr -n user.gz -v v acltest/src/f
          ./build-portable/gzstd -q -f -o acltest/a.tar.zst --tar --acls --xattrs acltest/src
          ./build-portable/gzstd -d -q --tar --acls --xattrs -C acltest/out acltest/a.tar.zst
          F=$(find acltest/out -type f -name f -print -quit)
          getfacl -cpn "$F" 2>/dev/null | grep "user:$(id -u):rwx" >/dev/null \
            || { echo "ERROR: ACL not restored — shipped binary lacks working --acls"; exit 1; }
          [ "$(getfattr -n user.gz --only-values "$F" 2>/dev/null)" = v ] \
            || { echo "ERROR: xattr not restored — shipped binary lacks working --xattrs"; exit 1; }
          echo "ACL/xattr round-trip OK"
          rm -rf acltest

      - name: Determine version + tag
        id: meta
        run: |
          # gzstd.cpp is the source of truth for the version string.
          version=$(grep -oP 'GZSTD_VERSION = "\K[0-9.]+' gzstd.cpp)
          # Use the pushed tag when triggered by tag, else synthesize from version.
          tag="${GITHUB_REF_NAME:-v$version}"
          if [[ "$tag" != "v$version" ]]; then
            echo "::warning::tag $tag does not match source version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Built version: $version (tag: $tag)"

      - name: Package
        id: package
        run: |
          # Outer filename is version-less so .../releases/latest/download/
          # gzstd-linux-x86_64.tar.gz stays stable across releases.  The
          # version is preserved inside (directory name + binary --version
          # output + LICENSE/CHANGELOG copies), so users can still audit
          # what they downloaded.
          inner="gzstd-${{ steps.meta.outputs.version }}-linux-x86_64"
          outer="gzstd-linux-x86_64.tar.gz"
          mkdir -p "release/$inner"
          cp build-portable/gzstd "release/$inner/"
          cp LICENSE CHANGELOG.md "release/$inner/"
          [ -f README.md ] && cp README.md "release/$inner/" || true
          cd release
          tar -czf "$outer" "$inner"
          sha256sum "$outer" > "${outer}.sha256"
          echo "tarball=release/${outer}" >> "$GITHUB_OUTPUT"
          echo "checksum=release/${outer}.sha256" >> "$GITHUB_OUTPUT"
          # The artifact name (workflow_dispatch path) keeps the version
          # so multiple manual runs don't collide.
          echo "artifact_name=$inner" >> "$GITHUB_OUTPUT"

      - name: Show release artifacts
        run: |
          ls -lh release/
          echo "---"
          cat release/*.sha256

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/

      - name: Attach to GitHub release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          generate_release_notes: true
          fail_on_unmatched_files: true
